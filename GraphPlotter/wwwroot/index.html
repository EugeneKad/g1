<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Построитель графиков 2D/3D</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js" charset="utf-8"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 2em;
            text-align: center;
        }

        .controls {
            background: #16213e;
            padding: 20px 30px;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1100px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group.formula-group {
            flex: 1;
            min-width: 250px;
        }

        label {
            font-size: 0.85em;
            color: #a0a0b0;
            font-weight: 500;
        }

        input[type="text"], input[type="number"] {
            background: #0f3460;
            border: 1px solid #1a4a7a;
            color: #e0e0e0;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #00d4ff;
        }

        input[type="text"] {
            width: 100%;
        }

        input[type="number"] {
            width: 100px;
        }

        button {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            height: fit-content;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .chart-container {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1100px;
            height: 550px;
            position: relative;
        }

        .error {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 0.9em;
            text-align: center;
            min-height: 20px;
        }

        .examples {
            background: #16213e;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1100px;
        }

        .examples h3 {
            color: #a0a0b0;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .example-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .example-btn {
            background: #0f3460;
            border: 1px solid #1a4a7a;
            color: #00d4ff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .example-btn:hover {
            background: #1a4a7a;
        }

        .supported {
            background: #16213e;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1100px;
            font-size: 0.85em;
            color: #a0a0b0;
        }

        .supported h3 {
            color: #e0e0e0;
            margin-bottom: 8px;
        }

        .supported code {
            background: #0f3460;
            padding: 2px 6px;
            border-radius: 4px;
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <h1>📈 Построитель графиков 2D/3D</h1>

    <div class="controls">
        <div class="control-group">
            <label for="mode">Режим</label>
            <select id="mode" onchange="toggleMode()" style="background: #0f3460; border: 1px solid #1a4a7a; color: #e0e0e0; padding: 10px 14px; border-radius: 8px; font-size: 1em; outline: none;">
                <option value="2d">2D</option>
                <option value="3d">3D</option>
            </select>
        </div>
        <div class="control-group formula-group">
            <label for="formula">f(x) =</label>
            <input type="text" id="formula" placeholder="Введите формулу, например: sin(x)" value="sin(x)">
        </div>
        <div class="control-group">
            <label for="xMin">x min</label>
            <input type="number" id="xMin" value="-10">
        </div>
        <div class="control-group">
            <label for="xMax">x max</label>
            <input type="number" id="xMax" value="10">
        </div>
        <div class="control-group" id="yMinGroup" style="display: none;">
            <label for="yMin">y min</label>
            <input type="number" id="yMin" value="-5">
        </div>
        <div class="control-group" id="yMaxGroup" style="display: none;">
            <label for="yMax">y max</label>
            <input type="number" id="yMax" value="5">
        </div>
        <div class="control-group">
            <label for="points">точек</label>
            <input type="number" id="points" value="500" min="50" max="2000">
        </div>
        <button onclick="plotGraph()">Построить</button>
    </div>

    <div class="error" id="error"></div>

    <div class="examples">
        <h3>Примеры формул:</h3>
        <div class="example-buttons">
            <button class="example-btn" onclick="setExample('sin(x)')">sin(x)</button>
            <button class="example-btn" onclick="setExample('cos(x)')">cos(x)</button>
            <button class="example-btn" onclick="setExample('x^2')">x²</button>
            <button class="example-btn" onclick="setExample('x^3 - 3*x')">x³ - 3x</button>
            <button class="example-btn" onclick="setExample('sqrt(x)')">√x</button>
            <button class="example-btn" onclick="setExample('abs(x)')">|x|</button>
            <button class="example-btn" onclick="setExample('1/x')">1/x</button>
            <button class="example-btn" onclick="setExample('exp(-x^2)')">e^(-x²)</button>
            <button class="example-btn" onclick="setExample('sin(x)/x')">sin(x)/x</button>
            <button class="example-btn" onclick="setExample('sin(x) + cos(2*x)')">sin(x) + cos(2x)</button>
            <button class="example-btn" onclick="setExample('tan(x)')">tan(x)</button>
            <button class="example-btn" onclick="setExample('log(x)')">log(x)</button>
            <button class="example-btn" onclick="setExample('ln(x)')">ln(x)</button>
            <button class="example-btn" onclick="setExample('2*sin(x) + cos(x/2)')">2sin(x)+cos(x/2)</button>
            <button class="example-btn" onclick="set3dExample('sin(sqrt(x^2 + y^2))')">sin(√(x²+y²))</button>
            <button class="example-btn" onclick="set3dExample('sin(x)*cos(y)')">sin(x)·cos(y)</button>
            <button class="example-btn" onclick="set3dExample('x^2 - y^2')">x² - y²</button>
            <button class="example-btn" onclick="set3dExample('exp(-(x^2 + y^2))')">e^(-(x²+y²))</button>
            <button class="example-btn" onclick="set3dExample('sin(x)/x * sin(y)/y')">sinc(x)·sinc(y)</button>
            <button class="example-btn" onclick="set3dExample('cos(x)*cos(y)')">cos(x)·cos(y)</button>
        </div>
    </div>

    <div class="chart-container" id="chart2dContainer">
        <canvas id="graphCanvas"></canvas>
    </div>
    <div class="chart-container" id="chart3dContainer" style="display: none;">
        <div id="graph3d" style="width: 100%; height: 100%;"></div>
    </div>

    <div class="supported">
        <h3>Поддерживаемые функции и константы:</h3>
        <p>
            <code>sin</code> <code>cos</code> <code>tan</code> <code>asin</code> <code>acos</code> <code>atan</code> |
            <code>sqrt</code> <code>abs</code> <code>log</code> <code>ln</code> <code>exp</code> |
            <code>ceil</code> <code>floor</code> <code>round</code> <code>sign</code> |
            <code>pi</code> <code>e</code> |
            переменные: <code>x</code>, <code>y</code> (для 3D) |
            операторы: <code>+</code> <code>-</code> <code>*</code> <code>/</code> <code>^</code>
        </p>
    </div>

    <script>
        let chart = null;
        let chart3d = null;

        function setExample(formula) {
            document.getElementById('formula').value = formula;
            document.getElementById('mode').value = '2d';
            toggleMode();
            plotGraph();
        }

        function set3dExample(formula) {
            document.getElementById('formula').value = formula;
            document.getElementById('mode').value = '3d';
            toggleMode();
            plotGraph();
        }

        function toggleMode() {
            const mode = document.getElementById('mode').value;
            const yMinGroup = document.getElementById('yMinGroup');
            const yMaxGroup = document.getElementById('yMaxGroup');
            const chart2dContainer = document.getElementById('chart2dContainer');
            const chart3dContainer = document.getElementById('chart3dContainer');
            const formulaInput = document.getElementById('formula');

            if (mode === '3d') {
                yMinGroup.style.display = 'flex';
                yMaxGroup.style.display = 'flex';
                chart2dContainer.style.display = 'none';
                chart3dContainer.style.display = 'block';
                formulaInput.placeholder = 'Введите формулу z = f(x,y), например: sin(x)*cos(y)';
            } else {
                yMinGroup.style.display = 'none';
                yMaxGroup.style.display = 'none';
                chart2dContainer.style.display = 'block';
                chart3dContainer.style.display = 'none';
                formulaInput.placeholder = 'Введите формулу, например: sin(x)';
            }
        }

        async function plotGraph() {
            const errorEl = document.getElementById('error');
            errorEl.textContent = '';

            const mode = document.getElementById('mode').value;
            const formula = document.getElementById('formula').value.trim();
            const xMin = parseFloat(document.getElementById('xMin').value);
            const xMax = parseFloat(document.getElementById('xMax').value);
            const points = parseInt(document.getElementById('points').value);

            if (!formula) {
                errorEl.textContent = 'Введите формулу';
                return;
            }

            if (isNaN(xMin) || isNaN(xMax) || xMin >= xMax) {
                errorEl.textContent = 'Некорректный диапазон x';
                return;
            }

            if (isNaN(points) || points < 10) {
                errorEl.textContent = 'Минимум 10 точек';
                return;
            }

            try {
                if (mode === '3d') {
                    const yMin = parseFloat(document.getElementById('yMin').value);
                    const yMax = parseFloat(document.getElementById('yMax').value);

                    if (isNaN(yMin) || isNaN(yMax) || yMin >= yMax) {
                        errorEl.textContent = 'Некорректный диапазон y';
                        return;
                    }

                    const url = `/api/graph/surface?formula=${encodeURIComponent(formula)}&xMin=${xMin}&xMax=${xMax}&yMin=${yMin}&yMax=${yMax}&gridSize=${Math.min(points, 150)}`;
                    const response = await fetch(url);

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(errorText);
                    }

                    const data = await response.json();

                    if (chart3d) {
                        Plotly.purge('graph3d');
                        chart3d = null;
                    }

                    // Extract unique x values (first row) and y values (first column)
                    const xUnique = data.xValues.map(row => row[0]);
                    const yUnique = data.yValues[0].map((_, j) => data.yValues[0][j]);

                    const trace = {
                        z: data.zValues,
                        x: xUnique,
                        y: yUnique,
                        type: 'surface',
                        colorscale: 'Viridis',
                        showscale: true,
                        contours: {
                            z: { show: true, usecolormap: true, highlightcolor: '#ff0000', project: { z: true } }
                        }
                    };

                    const layout = {
                        title: `z = ${formula}`,
                        scene: {
                            xaxis: { title: 'x', color: '#e0e0e0' },
                            yaxis: { title: 'y', color: '#e0e0e0' },
                            zaxis: { title: 'z', color: '#e0e0e0' },
                            bgcolor: '#16213e',
                            camera: {
                                eye: { x: 1.5, y: 1.5, z: 1.2 }
                            }
                        },
                        paper_bgcolor: '#16213e',
                        plot_bgcolor: '#16213e',
                        font: { color: '#e0e0e0' },
                        margin: { l: 0, r: 0, t: 40, b: 0 }
                    };

                    Plotly.newPlot('graph3d', [trace], layout, { responsive: true });
                } else {
                    const url = `/api/graph/points?formula=${encodeURIComponent(formula)}&xMin=${xMin}&xMax=${xMax}&points=${points}`;
                    const response = await fetch(url);

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(errorText);
                    }

                    const data = await response.json();

                    const labels = data.xValues.map((x, i) => ({ x: x, y: data.yValues[i] }));

                    if (chart) {
                        chart.destroy();
                    }

                    const ctx = document.getElementById('graphCanvas').getContext('2d');

                    chart = new Chart(ctx, {
                        type: 'scatter',
                        data: {
                            datasets: [{
                                label: `f(x) = ${formula}`,
                                data: labels,
                                showLine: true,
                                tension: 0.3,
                                pointRadius: 0,
                                pointHitRadius: 5,
                                borderWidth: 2.5,
                                borderColor: '#00d4ff',
                                backgroundColor: 'rgba(0, 212, 255, 0.1)',
                                fill: true,
                                spanGaps: false
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: {
                                duration: 600
                            },
                            scales: {
                                x: {
                                    type: 'linear',
                                    title: {
                                        display: true,
                                        text: 'x',
                                        color: '#a0a0b0',
                                        font: { size: 14 }
                                    },
                                    ticks: { color: '#a0a0b0' },
                                    grid: { color: 'rgba(255, 255, 255, 0.05)' }
                                },
                                y: {
                                    type: 'linear',
                                    title: {
                                        display: true,
                                        text: 'f(x)',
                                        color: '#a0a0b0',
                                        font: { size: 14 }
                                    },
                                    ticks: { color: '#a0a0b0' },
                                    grid: { color: 'rgba(255, 255, 255, 0.05)' }
                                }
                            },
                            plugins: {
                                legend: {
                                    labels: { color: '#e0e0e0', font: { size: 13 } }
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(22, 33, 62, 0.95)',
                                    titleColor: '#00d4ff',
                                    bodyColor: '#e0e0e0',
                                    borderColor: '#1a4a7a',
                                    borderWidth: 1,
                                    callbacks: {
                                        title: function(items) {
                                            return `x = ${items[0].parsed.x.toFixed(4)}`;
                                        },
                                        label: function(item) {
                                            const y = item.parsed.y;
                                            if (isNaN(y)) return null;
                                            return `f(x) = ${y.toFixed(4)}`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }

            } catch (err) {
                errorEl.textContent = `Ошибка: ${err.message}`;
            }
        }

        // Enter key support
        document.getElementById('formula').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') plotGraph();
        });

        // Auto-plot on load
        window.addEventListener('load', function() {
            toggleMode();
            plotGraph();
        });
    </script>
</body>
</html>
